name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      # The package supports Node 18, but the test runner (vitest 4) needs Node >= 20.
      - name: Test
        if: matrix.node-version != 18
        run: npm test

      - name: Load the built package (require and import)
        run: npm run test:package
